openapi: 3.1.0
info: {title: StoreMesh Cloud Aggregator API, version: 0.1.0}
servers: [{url: "http://localhost:4000"}]
paths:
  /health:
    get:
      responses:
        '200':
          description: Cloud process is healthy
          content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}
  /ready:
    get:
      responses:
        '200':
          description: Event repository restore completed
          content: {application/json: {schema: {$ref: '#/components/schemas/Ready'}}}
        '503':
          description: Event repository restore failed
          content: {application/json: {schema: {$ref: '#/components/schemas/NotReady'}}}
  /api/summary:
    get:
      security: [{cloudReportKey: []}]
      responses:
        '200':
          description: Per-site connectivity and event summary
          content: {application/json: {schema: {$ref: '#/components/schemas/CloudSummary'}}}
        '401':
          description: X-Cloud-Report-Key is invalid
          content: {application/json: {schema: {$ref: '#/components/schemas/CloudAuthenticationError'}}}
  /api/events:
    post:
      security: [{siteCode: [], siteKey: []}]
      parameters:
        - {in: header, name: X-Site-Key-Id, required: false, schema: {type: string, default: current}, description: Optional key version; defaults to current}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/SiteEvent'}}
      responses:
        '202':
          description: Events accepted, deduplicated, or rejected
          content: {application/json: {schema: {$ref: '#/components/schemas/EventIngestResult'}}}
        '401':
          description: Site headers do not authenticate
          content: {application/json: {schema: {$ref: '#/components/schemas/SiteAuthenticationError'}}}
components:
  securitySchemes:
    cloudReportKey: {type: apiKey, in: header, name: X-Cloud-Report-Key}
    siteCode: {type: apiKey, in: header, name: X-Site-Code}
    siteKey: {type: apiKey, in: header, name: X-Site-Key}
  schemas:
    Health: {type: object, required: [status], properties: {status: {type: string, const: ok}}}
    Ready: {type: object, required: [status], properties: {status: {type: string, const: ready}}}
    NotReady: {type: object, required: [status], properties: {status: {type: string, const: not_ready}}}
    CloudAuthenticationError: {type: object, required: [errorCode], properties: {errorCode: {type: string, const: CLOUD_REPORT_AUTHENTICATION_FAILED}}}
    SiteAuthenticationError: {type: object, required: [errorCode], properties: {errorCode: {type: string, const: SITE_AUTHENTICATION_FAILED}}}
    SiteSummary:
      type: object
      required: [events, lastSync, lastReceivedAt, status]
      properties:
        events: {type: integer, minimum: 0}
        lastSync: {type: [string, 'null'], format: date-time}
        lastReceivedAt: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [CONNECTED, STALE, PENDING]}
    CloudSummary:
      type: object
      required: [sites, totalEvents, staleThresholdMs]
      properties:
        sites: {type: object, additionalProperties: {$ref: '#/components/schemas/SiteSummary'}}
        totalEvents: {type: integer, minimum: 0}
        staleThresholdMs: {type: number, minimum: 0}
    SiteEvent:
      type: object
      required: [schemaVersion, id, site, type, entityId, occurredAt, payload]
      properties:
        schemaVersion: {type: integer, const: 2}
        id: {type: string}
        site: {type: string}
        type: {type: string}
        entityId: {type: [string, 'null']}
        occurredAt: {type: string, format: date-time}
        payload: {type: object}
      additionalProperties: true
    RejectedEvent:
      type: object
      required: [id, errorCode]
      properties:
        id: {type: [string, 'null']}
        errorCode: {type: string, enum: [SITE_MISMATCH, EVENT_SCHEMA_INVALID]}
    EventIngestResult:
      type: object
      required: [accepted, acceptedIds, duplicates, duplicateIds, rejected, total, checkpoint]
      properties:
        accepted: {type: integer, minimum: 0}
        acceptedIds: {type: array, items: {type: string}}
        duplicates: {type: integer, minimum: 0}
        duplicateIds: {type: array, items: {type: string}}
        rejected: {type: array, items: {$ref: '#/components/schemas/RejectedEvent'}}
        total: {type: integer, minimum: 0}
        checkpoint: {type: [string, 'null'], format: date-time}
