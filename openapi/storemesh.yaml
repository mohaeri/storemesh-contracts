openapi: 3.1.0
info: {title: StoreMesh Site API, version: 0.3.0}
servers: [{url: "http://localhost:3000"}]
security: [{bearerAuth: []}]
paths:
  /api/measurements: {post: {summary: Capture a server-timestamped raw reading from a registered active scale and operational session, including non-authoritative WASH_OBSERVATION and SLICE_OBSERVATION readings, responses: {'201': {description: Provenance-bearing measurement captured}, '403': {description: Invalid scale or station}}}}
  /api/auth/sessions/{sessionId}/revoke: {post: {summary: Revoke an active authentication session, responses: {'200': {description: Session revoked}, '403': {description: Manager or administrator permission required}, '404': {description: Session not found}}}}
  /health: {get: {security: [], responses: {'200': {description: Healthy}}}}
  /api/auth/login: {post: {security: [], summary: Authenticate a site user, responses: {'200': {description: Signed access token}, '401': {description: Invalid credentials}}}}
  /api/auth/login-badge: {post: {security: [], summary: Authenticate by a revocable scanner-originated badge code, responses: {'200': {description: Signed access token}, '401': {description: Invalid badge}}}}
  /api/sessions: {get: {summary: List operational sessions, responses: {'200': {description: Sessions}}}, post: {summary: Open an operational session, responses: {'201': {description: Session opened}}}}
  /api/sessions/{sessionId}/draft: {post: {summary: Persist an in-progress session draft, responses: {'201': {description: Draft persisted}}}}
  /api/receiving: {post: {summary: Receive and identify a batch using required scale measurementId, optional harvestPeriodId or the active configured period covering today, and optional expectedWeightKg for WEIGHT_ANOMALY evaluation; active RECEIVING operatingHoursStart and operatingHoursEnd values in HH:MM local time raise advisory RECEIVING_OUTSIDE_HOURS outside the window; returns HARVEST_PERIOD_NOT_CONFIGURED when no harvest period resolves, parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [supplier, product, grade, size, measurementId, containerId, sessionId], properties: {expectedWeightKg: {type: number, exclusiveMinimum: 0}, harvestPeriodId: {type: string, format: uuid}}}}}}, responses: {'201': {description: Batch received with optional warning exceptions}}}}
  /api/deliveries: {get: {summary: List supplier deliveries and their basket weigh records, responses: {'200': {description: Deliveries}}}, post: {summary: Start a multi-basket supplier delivery, responses: {'201': {description: Delivery opened}}}}
  /api/deliveries/{deliveryId}/complete: {post: {summary: Complete a delivery and create its aggregate receiving batch and cold-storage task, responses: {'201': {description: Delivery completed}, '409': {description: Empty or already completed delivery}}}}
  /api/deliveries/{deliveryId}/cancel: {post: {summary: Cancel an empty open delivery in its owning session with a required reason, responses: {'201': {description: Delivery cancelled}, '400': {description: Cancellation reason required}, '409': {description: Delivery is not open or already has weighed baskets}}}}
  /api/harvest-periods: {get: {summary: List admin-managed harvest period definitions, responses: {'200': {description: Harvest periods}}}, post: {summary: Create a harvest period definition, responses: {'201': {description: Harvest period created}}}}
  /api/harvest-periods/{periodId}/update: {post: {summary: Update a harvest period label or status, responses: {'201': {description: Harvest period updated}}}}
  /api/inventory: {get: {summary: Current site inventory; each Batch may include harvestPeriods as the complete deduplicated array of contributing periods alongside scalar harvestPeriod; every item exposes agingDays as whole days since its latest movement into the current zone or creation and agingWarning when the active STORAGE zone threshold is crossed; the lazy read raises one STORAGE_AGING_WARNING per Batch, responses: {'200': {description: Inventory items include agingDays and agingWarning}}}}
  /api/inventory/{entityType}/{entityId}/ledger: {get: {summary: Sequence-ordered append-only quantity history for one Batch Package FreshNetLot FreshShippingBox or Consumable without replacing its live balance, parameters: [{in: path, name: entityType, required: true, schema: {enum: [BATCH, PACKAGE, FRESH_NET_LOT, FRESH_SHIPPING_BOX, CONSUMABLE]}}, {in: path, name: entityId, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Ledger rows contain id entityType entityId delta reason beforeQty afterQty occurredAt sessionId deviceId siteId and sequence}}}}
  /api/movements: {post: {summary: Move only a free-standing Batch between zones and record quantity unit user object type movement type and optional reason; a physically contained Batch returns BATCH_MOVE_REQUIRES_CONTAINER_MOVE, responses: {'201': {description: Context-complete Batch movement recorded}, '409': {description: Contained Batch must move through its Container}}}}
  /api/transforms: {post: {summary: Apply identity-preserving WASH or SLICE to one scanned whole batch, or create genealogy only for a material MERGE; a multi-parent MERGE requires containerId for a scanned empty available BASKET or CRATE in SORTING and returns a child with deduplicated suppliers supplierIds and weighted supplierContributions while scalar supplier and supplierId are null only for mixed-supplier output; observation weights never replace WASH or SLICE inventory weight, responses: {'201': {description: Existing batch transitioned or material child batch created with supplier provenance}, '400': {description: MERGE_PHYSICAL_CONFIRMATION_REQUIRED when a multi-parent merge omits its physical container}, '409': {description: Identity-preserving process invariant or invalid merge container}}}}
  /api/cycles: {get: {summary: List machine processing cycles including batchIds and inputWeightKg, responses: {'200': {description: Cycles}}}, post: {summary: Create FREEZE from scanned physical trays, or create FREEZE_DRY and DRY from batchIds plus total inputWeightKg without mandatory per-carrier scans; legacy scanned-carrier input remains supported; an ACTIVE STATION_MACHINES configuration is mandatory and machineId must be designated for the active session station and cycle type, responses: {'201': {description: Cycle created}, '400': {description: Missing scan or invalid input weight}, '409': {description: STATION_MACHINES_NOT_CONFIGURED, MACHINE_NOT_CONFIGURED, active carrier, or invalid batch stage}}}}
  /api/cycles/{cycleId}/{action}: {post: {summary: Progress a processing cycle state machine; FAILED cycles require cycle:override and a reason for RESUME, RESTART, or SCRAP, record CYCLE_FAILURE_DECISION, and SCRAP produces terminal SCRAPPED status with affected inventory recorded as waste, responses: {'201': {description: Cycle transitioned}, '400': {description: Failed-cycle manager reason required}, '403': {description: Manager cycle override required}, '409': {description: Invalid transition}}}}
  /api/cycles/{cycleId}/trays/add: {post: {summary: Manager adds a physically scanned validated tray to a READY freezing cycle and records CYCLE_TRAY_ADDED, responses: {'201': {description: Tray added}, '403': {description: Manager permission required}, '409': {description: Cycle is not READY or tray is unavailable}}}}
  /api/cycles/{cycleId}/trays/remove: {post: {summary: Manager removes a scanned tray from a READY freezing cycle with a reason releases it and records CYCLE_TRAY_REMOVED; the final tray cannot be removed, responses: {'201': {description: Tray removed}, '400': {description: Reason required}, '409': {description: Cycle not READY or final tray}}}}
  /api/tray-allocations: {get: {summary: List physical tray allocation records including batch tray number optional quantity and sequence, responses: {'200': {description: Tray allocations}}}}
  /api/batches/{batchId}/tray-allocations: {post: {summary: Allocate a sliced Production Batch repeatedly across scanned trays with optional per-tray quantity and explicit completion confirmation that releases the source basket, responses: {'201': {description: Tray allocation recorded}, '400': {description: Invalid sequence quantity or incomplete confirmation}, '409': {description: Duplicate unavailable tray or allocation exceeds batch}}}}
  /api/packages: {get: {summary: List packages including nullable warehouseLocation and attributable Finished Goods movement history, responses: {'200': {description: Packages}}}, post: {summary: Create UNIT using only the active PACKAGING target weight and tolerance, with optional or site-required scale measurement; CARTON must be an empty DRAFT and childPackageIds preallocation is forbidden because physical UNIT scans build its contents, responses: {'201': {description: Package created}, '409': {description: PACKAGING_TOLERANCE_NOT_CONFIGURED or PACKAGE_WEIGHT_OUT_OF_TOLERANCE}}}}
  /api/packages/{packageId}/{action}: {post: {summary: Progress package state; manager-only REOPEN with reason returns a sealed unshipped carton to PACKING and records CARTON_REOPENED; CANCEL requires override:approve after PACKING and DAMAGE requires override:approve whenever shipmentId is set while unassigned damage remains operator-accessible, responses: {'201': {description: Package transitioned}, '403': {description: Manager override required}, '409': {description: Invalid transition}}}}
  /api/packages/{packageId}/scans: {post: {summary: Append one scanner-originated physical item event to a carton, responses: {'201': {description: Scan event recorded}, '409': {description: Duplicate or excess scan}}}}
  /api/packages/{packageId}/scans/remove: {post: {summary: Remove one physically rescanned UNIT from a reopened PACKING carton while preserving scan history, responses: {'201': {description: Scan released}, '404': {description: Active scan not found}}}}
  /api/packages/{packageId}/finished-goods: {post: {summary: Record FINISHED_GOODS_TRANSFERRED for a labeled CARTON with warehouseLocation operator device and time; relocating an already-warehoused carton requires override:approve and a reason, responses: {'201': {description: Finished Goods location recorded}, '400': {description: Location or relocation reason required}, '403': {description: Manager required for relocation}, '409': {description: Carton is not eligible}}}}
  /api/inventory-items/{itemType}/{itemId}/move: {post: {summary: Move an active Container Package at any packaging level or Fresh Shipping Box to a warehouseLocation with operator device session and time provenance; rejects terminal locked or another active-session-owned inventory, parameters: [{in: path, name: itemType, required: true, schema: {enum: [CONTAINER, PACKAGE, FRESH_SHIPPING_BOX]}}, {in: path, name: itemId, required: true, schema: {type: string, format: uuid}}], responses: {'201': {description: WAREHOUSE_LOCATION_CHANGED recorded}, '409': {description: Inventory is terminal locked or owned by another active session}}}}
  /api/inventory-items/{itemType}/{itemId}/emergency-relocate: {post: {summary: Manager-only emergency relocation of a Container Package or Fresh Shipping Box with a mandatory reason while bypassing lock and active-session ownership, parameters: [{in: path, name: itemType, required: true, schema: {enum: [CONTAINER, PACKAGE, FRESH_SHIPPING_BOX]}}, {in: path, name: itemId, required: true, schema: {type: string, format: uuid}}], responses: {'201': {description: EMERGENCY_RELOCATION recorded}, '400': {description: Emergency reason or location required}, '403': {description: override:approve permission required}}}}
  /api/shipments: {get: {summary: List customer shipments, responses: {'200': {description: Shipments}}}, post: {summary: Create a customer shipment only from unique READY_TO_SHIP CARTON packages and/or unique Fresh Shipping Boxes with genuine completed printing, latest APPROVED QC, valid hierarchy, no lock, and no blocking exception; assignment enriches a fresh box label with shipmentCode and customerCode destination, responses: {'201': {description: Shipment created}, '409': {description: SHIPMENT_CARTON_DUPLICATE SHIPMENT_BOX_DUPLICATE or current shipment-item eligibility failure}}}}
  /api/shipments/{shipmentId}/items: {post: {summary: Manager adds one eligible replacement CARTON or FRESH_SHIPPING_BOX to a DRAFT PICKING or READY shipment after damaged-item removal; fresh box assignment enriches its current label with shipmentCode and customerCode; enforces current label QC lock exception and sales-order quantity rules creates a Pick task and records SHIPMENT_ITEM_ADDED with replacesItemId, responses: {'201': {description: Replacement item assigned}, '403': {description: shipment:override permission required}, '409': {description: Ineligible item quantity exceeded or shipment already loaded}}}}
  /api/customers: {get: {summary: List customers, responses: {'200': {description: Customers}}}, post: {summary: Create customer, responses: {'201': {description: Customer created}}}}
  /api/customers/{customerId}/update: {post: {summary: Update customer, responses: {'201': {description: Customer updated}}}}
  /api/sales-orders: {get: {summary: List sales orders, responses: {'200': {description: Sales orders}}}, post: {summary: Create a sales order with each packageType appearing at most once; duplicate types return SALES_ORDER_ITEM_TYPE_DUPLICATE, responses: {'201': {description: Sales order created}, '409': {description: SALES_ORDER_ITEM_TYPE_DUPLICATE}}}}
  /api/shipment-carton-scans: {get: {summary: List shipment carton scans, responses: {'200': {description: Scans}}}}
  /api/shipments/{shipmentId}/scans: {post: {summary: Physically scan an expected CARTON or Fresh Shipping Box after revalidating current status assignment hierarchy quarantine QC lock genuine print and blocking exceptions, responses: {'201': {description: Typed shipment-item scan recorded}, '409': {description: Item unexpected duplicate or no longer eligible}}}}
  /api/shipments/{shipmentId}/priority: {post: {summary: Manager sets NORMAL HIGH or URGENT customer-shipment priority with a reason records SHIPMENT_PRIORITY_SET and updates active pick-task order, responses: {'201': {description: Shipment priority set}, '403': {description: Manager permission required}}}}
  /api/shipments/{shipmentId}/merge: {post: {summary: Manager merges same-sales-order pre-loaded shipment contents into a target shipment with a reason and SHIPMENT_MERGED audit, responses: {'201': {description: Shipments merged}, '409': {description: Shipments are incompatible or already loaded}}}}
  /api/fresh-shipping-boxes/{boxId}/split: {post: {summary: Manager moves a validated subset of net-lot allocations into a newly consumed and labelled unassigned shipping box with a reason and FRESH_SHIPPING_BOX_SPLIT audit, responses: {'201': {description: Shipping box split}, '409': {description: Source box or requested allocation is invalid}}}}
  /api/packaging/sessions: {post: {summary: Open a dedicated packaging session, responses: {'201': {description: Session opened}}}}
  /api/packaging/weigh: {post: {summary: Record the permanent pre-packaging measurement, responses: {'201': {description: Measurement recorded}}}}
  /api/batches/{batchId}/destination: {post: {summary: Manager assigns the next destination after sorting, responses: {'201': {description: Destination assigned}}}}
  /api/batches/{batchId}/override-grade: {post: {summary: Manager changes a non-terminal production Batch grade with a required reason and BATCH_GRADE_OVERRIDDEN audit event, responses: {'201': {description: Grade overridden}, '403': {description: Manager permission required}, '409': {description: Batch is no longer eligible}}}}
  /api/batches/{batchId}/override-destination: {post: {summary: Manager replaces an assigned Sorting or Washing destination with a required reason, cancels the old open task, creates the new task, and records BATCH_DESTINATION_OVERRIDDEN, responses: {'201': {description: Destination and task replaced}}}}
  /api/batches/{batchId}/priority: {post: {summary: Manager sets NORMAL HIGH or URGENT production-batch priority with a reason and propagates it to the assigned container, responses: {'201': {description: Priority set}}}}
  /api/batches/{batchId}/cancel-receiving: {post: {summary: Cancel only a fresh RECEIVED batch still in RECEIVING and alone in its container with no downstream operation movement or consumption; requires active sessionId and non-empty reason, records cancelledBy cancelledSessionId cancelledDeviceId cancellationReason cancelledAt, releases the container and removes its delivery-basket link, responses: {'201': {description: Receiving batch cancelled with evidence}, '400': {description: RECEIVING_CANCEL_REASON_REQUIRED}, '409': {description: RECEIVING_CANCEL_NOT_ELIGIBLE}}}}
  /api/internal-shipments: {post: {summary: Create an inter-site shipment to a distinct active catalog site with unique eligible top-level packages, responses: {'201': {description: Internal shipment created}, '400': {description: TRANSFER_DESTINATION_UNKNOWN}, '409': {description: TRANSFER_DESTINATION_SELF or TRANSFER_PACKAGE_DUPLICATE}}}}
  /api/internal-shipments/{shipmentId}/{action}: {post: {summary: Load requires an active session and vehicle; load and dispatch revalidate package status lock latest APPROVED QC blocking exceptions and completed print; dispatch additionally requires physical scans; cancel requires sessionId and a non-empty reason then records cancellationReason cancelledBy cancelledSessionId and cancelledDeviceId; cancel releases reserved packages, responses: {'201': {description: Internal shipment transitioned}, '400': {description: INTERNAL_SHIPMENT_CANCEL_REASON_REQUIRED or vehicle input missing}, '404': {description: SESSION_NOT_FOUND}, '409': {description: TRANSFER_PHYSICAL_SCAN_REQUIRED eligibility failure or invalid transition}}}}
  /api/shipments/{shipmentId}/manifest: {get: {summary: Export the HMAC-signed version 2 manifest of a dispatched inter-site shipment including each item's nullable harvestPeriod and harvestPeriodId provenance; requires shipping write authorization, responses: {'200': {description: Signed manifest}, '403': {description: Shipping permission required}, '409': {description: Transfer has not been dispatched}}}}
  /api/print-jobs: {get: {summary: List label print jobs, responses: {'200': {description: Print jobs}}}}
  /api/labels/reprint: {post: {summary: Reprint the existing identity of an active BASKET TRAY PACKAGE CARTON or FRESH_SHIPPING_BOX found by id or code; reasonCode is one of PRINTER_ERROR PAPER_FINISHED RIBBON_FINISHED DAMAGED_LABEL LOST_LABEL POOR_PRINT_QUALITY CUSTOMER_REQUEST OTHER; BASKET and TRAY require print:write while PACKAGE CARTON and FRESH_SHIPPING_BOX additionally require override:approve according to configurable PRINTING reprintApprovalByType rules; the attempt records defaultPrinterId selectedPrinterId and printerOverride, responses: {'201': {description: Existing label queued for reprint}, '400': {description: LABEL_REPRINT_REASON_INVALID}, '403': {description: Configured manager approval required}, '409': {description: ORIGINAL_LABEL_MISSING or inactive object}}}}
  /api/print-jobs/{jobId}/printer: {post: {summary: Override the workstation-resolved default printer for one pending print job and record selectedPrinterId separately with printerOverride true, responses: {'201': {description: Per-job printer override recorded}, '409': {description: Print job is not pending}}}}
  /api/print-jobs/{jobId}/{action}: {post: {summary: Claim complete fail or retry a label print attempt; fail requires reasonCode from PRINTER_ERROR PAPER_FINISHED RIBBON_FINISHED DAMAGED_LABEL LOST_LABEL POOR_PRINT_QUALITY CUSTOMER_REQUEST OTHER; retry requires a verified physical scan and non-empty reason, excessive retries use active PRINTING configuration, and successful completion atomically resolves matching label-failure exceptions, requestBody: {content: {application/json: {schema: {type: object, properties: {reasonCode: {type: string, enum: [PRINTER_ERROR, PAPER_FINISHED, RIBBON_FINISHED, DAMAGED_LABEL, LOST_LABEL, POOR_PRINT_QUALITY, CUSTOMER_REQUEST, OTHER]}, sessionId: {type: string}}}}}}, responses: {'201': {description: Print attempt updated}, '400': {description: PRINT_FAIL_REASON_INVALID or PRINT_RETRY_REASON_REQUIRED}}}}
  /api/trace/search: {get: {summary: Resolve a QR barcode serial batch shipment object code supplier name or customer name to a matched traceable object and deduplicated batchIds; records TRACE_SEARCHED with CODE_LOOKUP, parameters: [{in: query, name: code, required: true, schema: {type: string}}], responses: {'200': {description: matchedObject and batchIds}, '404': {description: TRACE_OBJECT_NOT_FOUND}}}}
  /api/trace/supplier/{supplierCode}: {get: {summary: Aggregate all receiving and descendant production batches packages shipping boxes shipments and distinct customers for a supplier; records TRACE_SEARCHED with SUPPLIER, responses: {'200': {description: Supplier trace aggregation}, '404': {description: Supplier not found}}}}
  /api/trace/customer/{customerId}: {get: {summary: Aggregate a customer's shipments packages shipping boxes production and receiving batches plus per-supplier weightKg contributions; records TRACE_SEARCHED with CUSTOMER, responses: {'200': {description: Customer trace with supplierContributions}, '404': {description: Customer not found}}}}
  /api/trace/{batchId}/recall: {get: {summary: Read-only recall analysis from a receiving or production Batch returning deduplicated packages cartons shippingBoxes shipments customers and separate stillInWarehouse and shippedToCustomers lists; records TRACE_SEARCHED with RECALL, responses: {'200': {description: Product recall analysis}, '404': {description: Batch not found}}}}
  /api/trace/{batchId}: {get: {summary: Read backward Batch genealogy with inventory:read authorization and a durable TRACE_SEARCHED audit; broken parent links return resolvable ancestors plus GENEALOGY_PARENT_MISSING or GENEALOGY_CYCLE_DETECTED integrity exceptions, parameters: [{in: path, name: batchId, required: true, schema: {type: string}}], responses: {'200': {description: Traceability graph and integrity issues}, '403': {description: inventory read permission required}}}}
  /api/trace/{batchId}/forward: {get: {summary: Resolve the single-site recall path from a Batch through descendants, outer packages or Fresh Shipping Boxes, shipments and customers; internal transfers return crossesTransferBoundary true and stop at destinationSite; records TRACE_SEARCHED with BATCH_FORWARD, parameters: [{in: path, name: batchId, required: true, schema: {type: string}}], responses: {'200': {description: Forward recall graph and integrity issues}, '403': {description: inventory read permission required}}}}
  /api/tasks: {get: {summary: With eligible=me and an active sessionId return separate available OPEN or BLOCKED tasks eligible for the selected session role and mine IN_PROGRESS PAUSED or BLOCKED tasks assigned to that operator; each task includes immutable readable code optional dueAt and expectedDurationMinutes a derived overdue flag nullable blockedByExceptionId and blockingException type/severity, responses: {'200': {description: Separate available and mine task lists}, '400': {description: TASK_SESSION_REQUIRED}}}, post: {summary: Create an ad-hoc manually completable task or an operation-backed task with an active master-data zone canonical priority integer from 1 through 100 operationType and optional ISO dueAt and positive expectedDurationMinutes, responses: {'201': {description: Task created with server-generated code}, '400': {description: MASTER_DATA_REFERENCE_INVALID or TASK_PRIORITY_INVALID}}}}
  /api/tasks/{taskId}/claim: {post: {summary: Atomically claim using only the active session selectedRole device and station; never the JWT full role set and never another users session, parameters: [{in: path, name: taskId, required: true, schema: {type: string}}], responses: {'201': {description: Task claimed or idempotently re-claimed by its assignee}, '403': {description: TASK_NOT_ELIGIBLE or SESSION_ACTOR_MISMATCH}, '409': {description: TASK_ASSIGNED_TO_ANOTHER or task unavailable}}}}
  /api/quality-checks:
    get: {summary: List quality checks including immutable sessionId and deviceId evidence, responses: {'200': {description: Quality checks}}}
    post:
      summary: Record an approval rejection or quarantine using an active operational session a checklist matching the batch actual stage and an attested JWT role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, checklistId, responses, result, sessionId, attestation]
              properties:
                batchId: {type: string, format: uuid}
                checklistId: {type: string, format: uuid}
                responses: {type: array, items: {type: object}}
                result: {type: string, enum: [APPROVED, REJECTED, QUARANTINED]}
                sessionId: {type: string, format: uuid}
                attestation: {type: object}
      responses:
        '201': {description: Quality check recorded with sessionId and server-derived deviceId}
        '404': {description: SESSION_NOT_FOUND}
        '403': {description: QC_ATTESTATION_ROLE_MISMATCH}
        '409': {description: QC_CHECKLIST_STAGE_MISMATCH}
  /api/quality-checks/release:
    post:
      summary: Release quarantined inventory, resolve its linked exception, and atomically align its physical container; omitted or unchanged destinationZone restores the pre-quarantine zone while a different legitimate forward destination conditionally requires a non-empty manager reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, reason, sessionId, attestation]
              properties:
                batchId: {type: string, format: uuid}
                reason: {type: string, minLength: 1}
                destinationZone: {type: string}
                sessionId: {type: string, format: uuid}
                attestation:
                  type: object
                  required: [confirmed, role]
                  properties:
                    confirmed: {type: boolean, enum: [true]}
                    role: {type: string, minLength: 1}
      responses:
        '201': {description: Inventory and container released with immutable attestation sessionId and server-derived deviceId}
        '400': {description: RELEASE_REASON_REQUIRED or RELEASE_DESTINATION_OVERRIDE_REASON_REQUIRED}
        '404': {description: SESSION_NOT_FOUND}
        '409': {description: RELEASE_DESTINATION_INVALID}
  /api/containers: {get: {summary: List containers, responses: {'200': {description: Containers}}}, post: {summary: Create a stage-aware container; RECEIVING_OPERATOR is limited to basic reusable BASKET or CRATE in RECEIVING, responses: {'201': {description: Container created}, '403': {description: Basic receiving-container scope exceeded}}}}
  /api/containers/{containerId}/{action}: {post: {summary: Assign inventory or move a Container; move requires scannedContainerId from a physical container scan and, when active WAREHOUSE_MOVEMENT requireDestinationScan is true, destinationZoneCode matching the target zone; movement records a CONTAINER row and contextual BATCH cascade rows with quantity unit user movement type and optional reason, requestBody: {content: {application/json: {schema: {type: object, properties: {scannedContainerId: {type: string, format: uuid}, destinationZoneCode: {type: string}}}}}}, responses: {'201': {description: Container and contents moved atomically}, '400': {description: CONTAINER_SCAN_REQUIRED or MOVEMENT_DESTINATION_SCAN_REQUIRED}, '409': {description: CONTAINER_SCAN_MISMATCH}}}}
  /api/containers/{containerId}/priority: {post: {summary: Manager sets NORMAL HIGH or URGENT container priority with a required reason and CONTAINER_PRIORITY_SET audit event, responses: {'201': {description: Priority set}, '400': {description: Invalid priority or missing reason}, '403': {description: Manager permission required}}}}
  /api/containers/{containerId}/transfer-damaged: {post: {summary: Transfer every batch from a damaged basket to a scanned empty same-type target; source becomes DAMAGED and CONTAINER_DAMAGED exception and movement history are recorded, responses: {'201': {description: Physical container replaced}, '409': {description: Invalid or insufficient target}}}}
  /api/deliveries/{deliveryId}/move-to-cold-storage: {post: {summary: Move each completed-delivery container to dirty cold storage, responses: {'201': {description: Containers moved}}}}
  /api/fresh-net-lots: {get: {summary: List aggregate fresh-export net lots with per-batch sourceContributions and harvest provenance, responses: {'200': {description: Net lots}}}, post: {summary: Pack nets from backward-compatible batchId/count or repeatable sources [{batchId,count}], with a physically scanned BASKET or CRATE work container and same product-grade-size enforcement, responses: {'201': {description: Net lot created with sourceContributions and containerId provenance}, '400': {description: CONTAINER_SCAN_REQUIRED}, '409': {description: FRESH_EXPORT_NET_WEIGHTS_NOT_CONFIGURED, FRESH_NET_LOT_MIXED_SOURCE, or invalid container/source state}}}}
  /api/fresh-shipping-boxes: {get: {summary: List fresh shipping boxes including DRAFT LABEL_PENDING LABEL_PRINTED READY_TO_SHIP lifecycle, measuredWeightKg weightMeasurementId and cold-holding warehouse provenance, responses: {'200': {description: Shipping boxes}}}, post: {summary: Backward-compatible atomic draft plus confirm wrapper with optional FRESH_SHIPPING_BOX measurementId and non-negative integer gelPackCount, responses: {'201': {description: LABEL_PENDING box and print job created}, '400': {description: FRESH_SHIPPING_BOX_GEL_PACK_COUNT_INVALID}, '409': {description: Allocation capacity or required measurement failed}}}}
  /api/fresh-shipping-boxes/drafts: {post: {summary: Reserve aggregated net-lot allocations in an editable DRAFT without consuming supplies or creating a print job; configured maxNetsPerBox and maxWeightKgPerBox return FRESH_SHIPPING_BOX_FULL, responses: {'201': {description: Draft shipping box created}, '409': {description: Allocation unavailable or configured box capacity exceeded}}}}
  /api/fresh-shipping-boxes/{id}/draft: {post: {summary: Replace add or remove allocations on a DRAFT box while synchronizing each fresh net lot remainingCount, responses: {'201': {description: Draft updated}, '409': {description: FRESH_SHIPPING_BOX_NOT_DRAFT or FRESH_SHIPPING_BOX_FULL}}}}
  /api/fresh-shipping-boxes/{id}/confirm: {post: {summary: Confirm a non-empty DRAFT, optionally consume official scale measurement evidence, consume configured supplies, enter LABEL_PENDING and queue label printing, responses: {'201': {description: Draft confirmed}, '409': {description: FRESH_SHIPPING_BOX_NOT_DRAFT or BOX_MEASUREMENT_REQUIRED}}}}
  /api/fresh-shipping-boxes/{id}/cold-holding: {post: {summary: Move a LABEL_PRINTED box into an attributable export cold-holding location and transition it to READY_TO_SHIP, responses: {'201': {description: Cold-holding movement recorded}, '409': {description: FRESH_SHIPPING_BOX_COLD_HOLDING_INVALID}}}}
  /api/fresh-shipping-boxes/{id}/cancel: {post: {summary: Cancel an active DRAFT LABEL_PENDING LABEL_PRINTED or READY_TO_SHIP unassigned box, restore net allocations, and reverse supplies only when they were consumed, parameters: [{name: id, in: path, required: true}], responses: {'201': {description: Shipping box cancelled}, '409': {description: Invalid terminal or shipment-assigned state}}}}
  /api/fresh-shipping-boxes/{id}/damage: {post: {summary: Mark an unshipped Fresh Shipping Box damaged and restore net allocations without returning destroyed consumables; when shipmentId is set override:approve is required and the box plus scan evidence are removed from that active shipment, parameters: [{name: id, in: path, required: true}], responses: {'201': {description: Shipping box damaged and exception raised}, '403': {description: Manager approval required for assigned box}, '409': {description: Invalid terminal state}}}}
  /api/consumables: {get: {summary: List consumable supply stock, responses: {'200': {description: Consumables}}}, post: {summary: Define a consumable and immediately evaluate its reorder threshold, responses: {'201': {description: Consumable created and threshold evaluated}}}}
  /api/consumables/{consumableId}/receipts: {get: {summary: List one consumable's receipts newest first without exposing other items, responses: {'200': {description: Receipt items include id consumableId quantity source and receivedAt}}}}
  /api/consumables/{consumableId}/transactions: {get: {summary: List one consumable's receipt consumption and reversal ledger newest first without exposing other items, responses: {'200': {description: Transaction items include id consumableId type quantity balance reason entityId and occurrence time}}}}
  /api/consumables/{id}: {patch: {summary: Update consumable name unit or non-negative reorderThreshold and re-evaluate stock threshold, parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}], responses: {'201': {description: Consumable updated}, '400': {description: CONSUMABLE_FIELDS_INVALID}}}}
  /api/consumables/{id}/activate: {post: {summary: Activate a consumable and re-evaluate its reorder threshold, parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}], responses: {'201': {description: Consumable activated}}}}
  /api/consumables/{id}/deactivate: {post: {summary: Deactivate a consumable; force true is required while a reorder or shortage exception is open and never resolves that exception, parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}], responses: {'201': {description: Consumable deactivated}, '409': {description: CONSUMABLE_HAS_OPEN_EXCEPTION}}}}
  /api/consumables/{consumableId}/receive: {post: {summary: Record an inbound receipt with an optional parseable non-future receivedAt, reevaluate reorder threshold, and auto-resolve its reorder exception above threshold, responses: {'201': {description: Receipt recorded and threshold state synchronized}, '400': {description: CONSUMABLE_RECEIPT_DATE_INVALID}}}}
  /api/sorting: {post: {summary: Split a batch by grade and size only after a distinct empty physical output container is scanned for every output; non-zero loss requires lossReason WASTE DAMAGE MOISTURE_LOSS RESIDUAL_MATERIAL or MEASUREMENT_VARIANCE, responses: {'201': {description: Sorting outputs atomically assigned to their scanned containers with classified loss}, '400': {description: SORT_OUTPUT_CONTAINER_SCAN_REQUIRED SORT_LOSS_REASON_REQUIRED or SORT_LOSS_REASON_INVALID}, '409': {description: Duplicate unavailable occupied or incorrectly staged output container}}}}
  /api/configurations: {get: {summary: List configuration versions with proposedValues and currentActiveValues for approval comparison; FRESH_EXPORT values include allowedNetWeightsKg requireBoxScaleEvidence and nullable maxNetsPerBox maxWeightKgPerBox, RECEIVING supports weightVarianceLimit plus optional operatingHoursStart and operatingHoursEnd in HH:MM local time which require an explicit DST-aware IANA timezone, WAREHOUSE_MOVEMENT supports boolean requireDestinationScan, and STORAGE supports agingWarningDaysByZone as a zone-to-positive-days map, responses: {'200': {description: Configurations}}}, post: {summary: Create a schema-validated configuration Draft for PACKAGING PRINTING CONSUMABLES STATION_MACHINES RECEIVING WAREHOUSE_MOVEMENT STORAGE YIELD_THRESHOLDS FRESH_EXPORT or SYSTEM_TIMEOUTS, responses: {'201': {description: Configuration created}, '400': {description: CONFIGURATION_SCOPE_REQUIRED CONFIGURATION_SCOPE_UNKNOWN CONFIGURATION_VALUES_INVALID CONFIGURATION_SCHEMA_INVALID or RECEIVING_HOURS_TIMEZONE_REQUIRED}}}}
  /api/configurations/{configurationId}/{action}: {post: {summary: Approve or activate configuration, responses: {'201': {description: Configuration transitioned}}}}
  /api/overrides: {get: {summary: List manager overrides, responses: {'200': {description: Overrides}}}, post: {summary: Request an override, responses: {'201': {description: Override requested}}}}
  /api/overrides/{overrideId}/resolve: {post: {summary: Resolve a manager override, responses: {'201': {description: Override resolved}}}}
  /api/internal-transfers: {get: {summary: List received transfers with durable batchIds linking every batch created from the received manifest, responses: {'200': {description: Transfers with batchIds array}}}}
  /api/internal-transfers/receive: {post: {summary: Receive a signed dispatched manifest only after scanning every unique package and an available empty RECEIVING container; new batches are assigned to that container and receivedBy is derived from the authenticated session, responses: {'201': {description: Transfer received into the scanned container}, '400': {description: CONTAINER_SCAN_REQUIRED}, '409': {description: Duplicate manifest content invalid container or physical scan failure}}}}
  /api/inventory-adjustments: {get: {summary: List inventory adjustment requests including LOCATION_CORRECTION drafts, responses: {'200': {description: Adjustments}}}, post: {summary: Request a weight adjustment or a LOCATION_CORRECTION with itemType itemId warehouseLocation and reason; every location correction remains draft for second-manager approval, responses: {'201': {description: Draft or approved adjustment recorded}}}}
  /api/inventory-adjustments/{id}/approve: {post: {summary: Approve a draft adjustment using four-eyes control at or above tolerance, parameters: [{in: path, name: id, required: true, schema: {type: string}}], responses: {'201': {description: Adjustment approved and inventory changed atomically}}}}
  /api/inventory-adjustments/{id}/reject: {post: {summary: Reject a draft adjustment without changing inventory, parameters: [{in: path, name: id, required: true, schema: {type: string}}], responses: {'201': {description: Adjustment rejected}}}}
  /api/audit: {get: {summary: Read immutable live audit events with explicit entityType and entityId, per-site monotonic sequence ordering, and optionally normalized archived history, parameters: [{in: query, name: includeArchived, required: false, schema: {type: boolean, default: false}, description: Include events moved to permanent PostgreSQL history in the same Event envelope shape}], responses: {'200': {description: Live and optionally archived Audit Event envelopes including entityType, entityId, and sequence}}}}
  /api/outbox: {get: {summary: Read cloud delivery outbox ordered by site and monotonic sequence, responses: {'200': {description: Outbox Event envelopes including sequence}}}}
  /ready: {get: {security: [], responses: {'200': {description: Dependencies ready}, '503': {description: Dependency unavailable}}}}
  /metrics: {get: {security: [], responses: {'200': {description: Prometheus metrics}}}}
  /api/sessions/{sessionId}/{action}: {post: {summary: Suspend, resume, complete, or cancel a session, parameters: [{in: path, name: sessionId, required: true, schema: {type: string}}, {in: path, name: action, required: true, schema: {enum: [suspend, resume, complete, cancel]}}], responses: {'201': {description: Session transitioned}, '409': {description: Invalid transition}}}}
  /api/shipments/{shipmentId}/{action}: {post: {summary: Advance the lifecycle; start picking ready load and ship revalidate current status assignment hierarchy quarantine latest APPROVED QC lock genuine print and blocking exceptions; cancellation always requires a reason and PICKING or READY cancellation additionally requires override approval while atomically closing orphan pick tasks, parameters: [{in: path, name: shipmentId, required: true, schema: {type: string}}, {in: path, name: action, required: true, schema: {enum: [start_picking, ready, load, ship, close, cancel]}}], responses: {'201': {description: Shipment and all assigned items transitioned}, '400': {description: SHIPMENT_CANCEL_REASON_REQUIRED}, '409': {description: Invalid transition incomplete scans or current eligibility failure}}}}
  /api/tasks/recommended: {get: {summary: Get the highest-priority OPEN task eligible for the active session selectedRole, responses: {'200': {description: Recommended task}, '400': {description: TASK_SESSION_REQUIRED}}}}
  /api/tasks/{taskId}/reassign: {post: {summary: Manager reassigns an active task to an eligible operator with a required reason, responses: {'201': {description: Task reassigned}, '400': {description: TASK_REASSIGN_REASON_REQUIRED}}}}
  /api/skills: {get: {summary: List skills, responses: {'200': {description: Skills}}}, post: {summary: Create a skill, responses: {'201': {description: Skill created}}}}
  /api/roles: {get: {summary: List data-backed roles and permissions, responses: {'200': {description: Roles}}}, post: {summary: Create a custom role, responses: {'201': {description: Role created}}}}
  /api/roles/{roleCode}/update: {post: {summary: Update a role permission set, responses: {'201': {description: Role updated}}}}
  /api/users: {get: {summary: List users with role skill status and badge-assignment metadata, responses: {'200': {description: Safe user administration view}, '403': {description: Administrator permission required}}}}
  /api/users/{userId}/roles: {post: {summary: Assign a role to a user, responses: {'201': {description: Role assigned}}}}
  /api/users/{userId}/badge: {post: {summary: Generate or replace a user's random badge credential, responses: {'201': {description: New badge code returned once}}}}
  /api/users/{userId}/pin: {post: {summary: Generate or replace the independently hashed six-digit badge PIN, responses: {'201': {description: New PIN returned once}}}}
  /api/users/{userId}/roles/{roleCode}: {delete: {summary: Revoke a role from a user, responses: {'201': {description: Role revoked}}}}
  /api/users/{userId}/skills: {post: {summary: Assign a skill to a user, responses: {'201': {description: Skill assigned}}}}
  /api/users/{userId}/skills/{skillId}: {delete: {summary: Revoke a skill from a user, responses: {'201': {description: Skill revoked}}}}
  /api/devices: {get: {summary: List devices with heartbeat presence, responses: {'200': {description: Devices}}}, post: {summary: Register a device, responses: {'201': {description: Device registered}}}}
  /api/devices/{deviceCode}/heartbeat: {post: {summary: Record a device heartbeat, responses: {'201': {description: Heartbeat recorded}}}}
  /api/devices/{deviceId}/retire: {post: {summary: Retire a device, responses: {'201': {description: Device retired}}}}
  /api/exceptions: {get: {summary: Search durable operational exceptions by AND-combined status severity category from to operator machineId product batchId shipmentId and assignedTo filters; responses include category creator assignee related object note lifecycle timestamps resolution and closure user, responses: {'200': {description: Filtered exceptions}}}, post: {summary: Raise an OPEN exception categorized by active EXCEPTION_CATEGORIES mapping with unmapped types defaulting to System and an optional free-text note; open HIGH or CRITICAL Batch exceptions block operations, requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {type: {type: string}, entityType: {type: string}, entityId: {type: string, format: uuid}, severity: {type: string, enum: [INFO, WARNING, HIGH, CRITICAL]}, note: {type: string, nullable: true}}}}}}, responses: {'201': {description: Exception raised with category}}}}
  /api/exceptions/{exceptionId}/assign: {post: {summary: Assign an exception, responses: {'201': {description: Exception assigned}}}}
  /api/exceptions/{exceptionId}/start: {post: {summary: Assigned responsible user exclusively advances ASSIGNED to IN_PROGRESS, responses: {'201': {description: Exception work started}, '409': {description: Assignee or lifecycle mismatch}}}}
  /api/exceptions/{exceptionId}/resolve: {post: {summary: Manager resolves or dismisses OPEN ASSIGNED or IN_PROGRESS exception with a resolution note, responses: {'201': {description: Exception RESOLVED or DISMISSED}}}}
  /api/exceptions/{exceptionId}/close: {post: {summary: Manager-gated closure advances RESOLVED or DISMISSED to CLOSED records closedBy and closedAt and optionally stores rootCause correctiveAction and preventiveAction, responses: {'201': {description: Exception CLOSED}, '403': {description: override approve permission required}}}}
  /api/master-data/{catalog}: {get: {summary: List a master-data catalog; supplier items may include the optional SupplierReference contact region and settlement fields, responses: {'200': {description: Catalog}}}, post: {summary: Create a catalog item including optional SupplierReference fields when catalog is suppliers, responses: {'201': {description: Item created}}}}
  /api/master-data/{catalog}/{itemId}/update: {post: {summary: Update a catalog item including optional SupplierReference fields for suppliers; supplied strings must remain non-blank or MASTER_DATA_FIELDS_INVALID is returned, responses: {'201': {description: Item updated}, '400': {description: Invalid catalog fields}}}}
  /api/qc-checklists: {get: {summary: List QC checklist definitions, responses: {'200': {description: Checklists}}}, post: {summary: Create a QC checklist for a referenced product and one of RECEIVING SORTING WASHING SLICING FREEZING FREEZE_DRYING DRYING or PACKAGING, responses: {'201': {description: Checklist created}, '400': {description: QC_CHECKLIST_STAGE_INVALID}, '404': {description: MASTER_DATA_REFERENCE_INVALID}}}}
  /api/reports/operations: {get: {summary: Aggregated yield utilization exception and task reports; exception dashboard includes critical overdue from configurable severity SLA byCategory and byProductionArea, responses: {'200': {description: Operational reports}}}}
  /api/reports/sorting-loss: {get: {summary: Aggregate sorting loss by site product and lossReason, responses: {'200': {description: Items contain site product lossReason totalLossKg and eventCount}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    SupplierReference:
      type: object
      required: [id, code, name, status]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        status: {enum: [ACTIVE, INACTIVE]}
        contactName: {type: string}
        contactPhone: {type: string}
        contactEmail: {type: string}
        region: {type: string}
        settlementReference: {type: string}
    Error:
      type: object
      required: [success, errorCode, message]
      properties:
        success: {const: false}
        errorCode: {type: string}
        message: {type: string}
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
    SignedTransferManifest:
      type: object
      required: [manifestVersion, nonce, sourceSite, destinationSite, shipmentCode, status, dispatchedAt, packages, signature]
      properties:
        manifestVersion: {const: 2}
        nonce: {type: string, format: uuid}
        sourceSite: {type: string}
        destinationSite: {type: string}
        shipmentCode: {type: string}
        status: {enum: [DISPATCHED, DELIVERED]}
        dispatchedAt: {type: string, format: date-time}
        packages: {type: array, minItems: 1, items: {type: object}}
        signature: {type: string, description: Base64url HMAC-SHA256 over the canonical unsigned manifest}
    Event:
      type: object
      required: [id, site, sequence, type, entityType, entityId, payload, schemaVersion, occurredAt]
      properties:
        id: {type: string, format: uuid}
        site: {type: string}
        sequence: {type: integer, format: int64, minimum: 1, description: Monotonic ordering within one site}
        type: {type: string}
        entityType: {type: [string, 'null'], description: Business object type; null only for legacy or entity-less events}
        entityId: {type: [string, 'null']}
        payload: {type: object}
        schemaVersion: {type: integer}
        occurredAt: {type: string, format: date-time}
